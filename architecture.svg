<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa6b2"/>
    </marker>
    <marker id="arrowp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9b7cd1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <!-- ===== edges ===== -->
  <g stroke="#9aa6b2" stroke-width="1.6" fill="none">
    <line x1="150" y1="220" x2="198" y2="220" marker-end="url(#arrow)"/>
    <line x1="330" y1="220" x2="398" y2="112" marker-end="url(#arrow)"/>
    <line x1="330" y1="220" x2="398" y2="220" marker-end="url(#arrow)"/>
    <line x1="330" y1="220" x2="398" y2="330" marker-end="url(#arrow)"/>
    <line x1="530" y1="220" x2="638" y2="150" marker-end="url(#arrow)"/>
    <line x1="530" y1="220" x2="638" y2="332" marker-end="url(#arrow)"/>
    <line x1="770" y1="345" x2="828" y2="345" marker-end="url(#arrow)"/>
  </g>

  <!-- feedback edge (worker -> FastAPI) -->
  <path d="M 855,372 C 700,432 560,432 533,247" fill="none" stroke="#9b7cd1" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrowp)"/>

  <!-- ===== edge labels ===== -->
  <g font-size="12" fill="#7a8694">
    <text x="372" y="158">/static</text>
    <text x="356" y="212">/api</text>
    <text x="372" y="286">/</text>
    <text x="590" y="284">publish</text>
    <text x="690" y="424" text-anchor="middle" fill="#9b7cd1">/save-prediction</text>
  </g>

  <!-- ===== nodes ===== -->
  <!-- Client -->
  <g>
    <rect x="20" y="195" width="130" height="50" rx="10" fill="#eef2f7" stroke="#b0bcc9"/>
    <text x="85" y="225" text-anchor="middle" font-size="14" fill="#2b3440">Клиент</text>
  </g>
  <!-- nginx -->
  <g>
    <rect x="200" y="193" width="130" height="54" rx="10" fill="#e6f4ec" stroke="#7cb894"/>
    <text x="265" y="216" text-anchor="middle" font-size="14" fill="#2b3440">nginx</text>
    <text x="265" y="234" text-anchor="middle" font-size="11" fill="#6a7480">:80 / :443</text>
  </g>
  <!-- Static -->
  <g>
    <rect x="400" y="70" width="150" height="50" rx="10" fill="#eef2f7" stroke="#b0bcc9"/>
    <text x="475" y="92" text-anchor="middle" font-size="14" fill="#2b3440">Статика</text>
    <text x="475" y="109" text-anchor="middle" font-size="11" fill="#6a7480">nginx/static</text>
  </g>
  <!-- FastAPI -->
  <g>
    <rect x="400" y="193" width="150" height="54" rx="10" fill="#e7effd" stroke="#6b8cff"/>
    <text x="475" y="216" text-anchor="middle" font-size="14" fill="#23324d">FastAPI</text>
    <text x="475" y="234" text-anchor="middle" font-size="11" fill="#6a7480">app · :8080</text>
  </g>
  <!-- Jinja2 -->
  <g>
    <rect x="400" y="318" width="150" height="50" rx="10" fill="#eef2f7" stroke="#b0bcc9"/>
    <text x="475" y="340" text-anchor="middle" font-size="14" fill="#2b3440">Jinja2</text>
    <text x="475" y="357" text-anchor="middle" font-size="11" fill="#6a7480">app/view</text>
  </g>
  <!-- PostgreSQL -->
  <g>
    <rect x="640" y="114" width="180" height="72" rx="10" fill="#eaf3fb" stroke="#6a9fd4"/>
    <text x="730" y="139" text-anchor="middle" font-size="14" fill="#23324d">PostgreSQL</text>
    <text x="730" y="158" text-anchor="middle" font-size="11" fill="#6a7480">компании · лицензии</text>
    <text x="730" y="173" text-anchor="middle" font-size="11" fill="#6a7480">пациенты · задачи</text>
  </g>
  <!-- RabbitMQ -->
  <g>
    <rect x="640" y="320" width="130" height="50" rx="10" fill="#fdeede" stroke="#e0913f"/>
    <text x="705" y="350" text-anchor="middle" font-size="14" fill="#5a3a17">RabbitMQ</text>
  </g>
  <!-- ml_worker -->
  <g>
    <rect x="828" y="320" width="122" height="50" rx="10" fill="#f1eafb" stroke="#9b7cd1"/>
    <text x="889" y="342" text-anchor="middle" font-size="14" fill="#3d2a5c">ml_worker</text>
    <text x="889" y="359" text-anchor="middle" font-size="11" fill="#6a7480">n реплик</text>
  </g>
</svg>
